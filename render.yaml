services:
  - type: web
    name: eventia
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eventia-db
          property: connectionString
      - key: EVENTIA_ORIGIN
        fromService:
          name: eventia
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: COOKIE_SECURE
        value: "1"
databases:
  - name: eventia-db
    databaseName: eventia
    user: eventia
    plan: free
