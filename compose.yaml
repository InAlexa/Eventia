services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: eventia
      POSTGRES_USER: eventia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventia"]
      interval: 5s
      retries: 10
  web:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment: &appenv
      DATABASE_URL: postgresql://eventia:${POSTGRES_PASSWORD}@db:5432/eventia
      EVENTIA_ORIGIN: http://127.0.0.1:8000
      COOKIE_SECURE: "0"
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: ["python", "manage.py", "worker"]
    environment: *appenv
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres:
